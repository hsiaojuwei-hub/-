<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日本購物優惠指南 | Japan Coupon Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.1/lucide.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Inter:wght@400;600;800&display=swap');
        
        body { 
            font-family: 'Inter', 'Noto Sans TC', sans-serif; 
            background: #f1f5f9;
            color: #475569; 
        }
        .glass-card { 
            background: #ffffff;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.02);
            transition: all 0.3s ease;
        }
        .glass-card:hover {
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            transform: translateY(-5px);
        }
    </style>
</head>
<body class="min-h-screen pb-20">
    <div class="max-w-7xl mx-auto px-4 py-12">
        <header class="text-center mb-12">
            <h1 class="text-4xl md:text-5xl font-black text-slate-900 mb-4 tracking-tight">
                日本購物優惠指南
            </h1>
            <p class="text-slate-500 font-medium text-lg">掃描、展示、享受您的退稅與折扣</p>
        </header>

        <div class="flex flex-wrap gap-3 mb-12 justify-center" id="filter-buttons">
            <button data-cat="all" onclick="filterCoupons('all')" class="px-6 py-2.5 bg-slate-900 text-white rounded-xl font-bold transition-all shadow-md">全部</button>
            <button data-cat="electronics" onclick="filterCoupons('electronics')" class="px-6 py-2.5 bg-white border border-slate-200 text-slate-600 rounded-xl font-medium hover:bg-slate-50 transition-all">電器</button>
            <button data-cat="drugstore" onclick="filterCoupons('drugstore')" class="px-6 py-2.5 bg-white border border-slate-200 text-slate-600 rounded-xl font-medium hover:bg-slate-50 transition-all">藥妝</button>
            <button data-cat="sports" onclick="filterCoupons('sports')" class="px-6 py-2.5 bg-white border border-slate-200 text-slate-600 rounded-xl font-medium hover:bg-slate-50 transition-all">運動</button>
            <button data-cat="donki" onclick="filterCoupons('donki')" class="px-6 py-2.5 bg-white border border-slate-200 text-slate-600 rounded-xl font-medium hover:bg-slate-50 transition-all">唐吉</button>
        </div>

        <div id="coupon-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </div>

    <script>
        const coupons = [
            { id: 1, name: "必客家美樂 (Bic Camera)", category: "electronics", url: "https://www.beurlife.com/wp-content/uploads/2025/08/BicCamera_coupon_beurlife_2026Aug.png", isLink: false },
            { id: 2, name: "愛電王 (EDION)", category: "electronics", url: "https://www.beurlife.com/wp-content/uploads/2025/12/EDION_coupon_2026Oct.jpg", isLink: false },
            { id: 3, name: "山田電機 (Yamada Denki)", category: "electronics", url: "https://www.beurlife.com/wp-content/uploads/2026/01/Yamada_coupang_2026Dec.jpg", isLink: false },
            { id: 4, name: "松本清 (Matsumoto Kiyoshi)", category: "drugstore", url: "https://www.beurlife.com/wp-content/uploads/2026/03/Matsumotokiyoshi_coupang-2027Mar.png", isLink: false },
            { id: 5, name: "可開購 (Cocokara Fine)", category: "drugstore", url: "https://www.beurlife.com/wp-content/uploads/2026/03/cocokara_fine_drug_store_coupon-2027Mar.png", isLink: false },
            { id: 6, name: "鶴羽藥妝 (Tsuruha Drug)", category: "drugstore", url: "https://www.beurlife.com/wp-content/uploads/2026/03/Tsuruha_drug_store-2027Dec.png", isLink: false },
            { id: 7, name: "杉藥局 (Sugi Pharmacy)", category: "drugstore", url: "https://www.beurlife.com/wp-content/uploads/2026/03/Sugi_drug_store-2027Feb.png", isLink: false },
            { id: 8, name: "阿爾卑斯 (Alpen Group)", category: "sports", url: "https://travelcontentsapp.com/coupon/alpen-group/", isLink: true },
            { id: 9, name: "唐吉訶德 (Don Quijote)", category: "donki", url: "https://japanportal.donki-global.com/coupon/cp001_zhtw.html", isLink: true }
        ];

        function filterCoupons(category) {
            const grid = document.getElementById('coupon-grid');
            const buttons = document.querySelectorAll('#filter-buttons button');
            
            buttons.forEach(btn => {
                const isActive = btn.dataset.cat === category;
                btn.className = isActive ? 
                    "px-6 py-2.5 bg-slate-900 text-white rounded-xl font-bold transition-all shadow-md" : 
                    "px-6 py-2.5 bg-white border border-slate-200 text-slate-600 rounded-xl font-medium hover:bg-slate-50 transition-all";
            });

            grid.innerHTML = '';
            const filtered = category === 'all' ? coupons : coupons.filter(c => c.category === category);
            
            filtered.forEach(c => {
                const card = document.createElement('div');
                card.className = "glass-card p-6 rounded-3xl flex flex-col justify-between";
                card.innerHTML = `
                    <div>
                        <h3 class="font-black text-slate-800 text-xl mb-4">${c.name}</h3>
                        <div class="flex items-center gap-2 text-amber-700 bg-amber-50 px-3 py-1 rounded-lg w-fit border border-amber-100 mb-6">
                            <i data-lucide="alert-circle" class="w-4 h-4"></i>
                            <span class="text-xs font-bold tracking-wide">結帳時主動出示</span>
                        </div>
                    </div>
                    <div>
                        ${c.isLink ? 
                            `<a href="${c.url}" target="_blank" class="flex items-center justify-center gap-2 w-full py-3 bg-slate-900 text-white rounded-xl font-bold hover:bg-slate-800 transition-all">
                                <i data-lucide="external-link" class="w-4 h-4"></i> 前往官網優惠
                            </a>` :
                            `<div class="cursor-pointer group" onclick="window.open('${c.url}')">
                                <img src="${c.url}" alt="${c.name}" class="w-full h-32 object-cover rounded-2xl border border-slate-200">
                                <p class="text-center text-[10px] text-slate-400 mt-3 font-bold uppercase tracking-widest">點擊圖片放大檢視</p>
                            </div>`
                        }
                    </div>
                `;
                grid.appendChild(card);
            });
            if (typeof lucide !== 'undefined') lucide.createIcons();
        }

        window.onload = () => filterCoupons('all');
    </script>
</body>
</html>
